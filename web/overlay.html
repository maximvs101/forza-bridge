<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Forza — overlay telemetrie</title>
<style>
  :root { --accent: #35a7ff; --warn: #ff6b35; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    font-family: "Segoe UI", system-ui, sans-serif;
    color: #fff;
    background: transparent; /* fond transparent : source navigateur OBS */
  }
  .hud {
    display: inline-flex; flex-direction: column; gap: 14px;
    padding: 20px 26px; border-radius: 14px;
    background: rgba(12, 14, 18, 0.72);
    backdrop-filter: blur(6px);
    min-width: 340px;
  }
  .car { font-size: 15px; letter-spacing: .5px; opacity: .75; }
  .speed { font-size: 68px; font-weight: 700; line-height: .95; font-variant-numeric: tabular-nums; }
  /* Cible la seule unite : `.speed span` touchait aussi le nombre, qui
     s'affichait alors en 22 px pales comme le libelle "km/h". */
  .speed .unit { font-size: 22px; font-weight: 400; opacity: .6; margin-left: 6px; }
  .row { display: flex; align-items: baseline; gap: 18px; }
  .gear {
    font-size: 40px; font-weight: 700; min-width: 56px; text-align: center;
    padding: 2px 10px; border-radius: 8px; background: rgba(255,255,255,.08);
  }
  .bar { height: 12px; border-radius: 6px; background: rgba(255,255,255,.12); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0%; border-radius: 6px; transition: width .06s linear; }
  .rpm > i { background: linear-gradient(90deg, var(--accent), var(--warn)); }
  .pedals { display: flex; gap: 10px; }
  .pedals > div { flex: 1; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; opacity: .55; margin-bottom: 4px; }
  .accel > i { background: #4ade80; }
  .brake > i { background: #f87171; }
  .status { font-size: 12px; opacity: .6; }
  .status.err { color: #f87171; opacity: 1; }
  .status.stale { color: #fbbf24; opacity: 1; }
</style>
</head>
<body>
<div class="hud">
  <div class="car" id="car">—</div>
  <div class="row">
    <div class="speed"><span id="speed">0</span><span class="unit">km/h</span></div>
    <div class="gear" id="gear">N</div>
  </div>
  <div>
    <div class="label">Regime moteur</div>
    <div class="bar rpm"><i id="rpm"></i></div>
  </div>
  <div class="pedals">
    <div>
      <div class="label">Accelerateur</div>
      <div class="bar accel"><i id="accel"></i></div>
    </div>
    <div>
      <div class="label">Frein</div>
      <div class="bar brake"><i id="brake"></i></div>
    </div>
  </div>
  <div class="status" id="status">Connexion...</div>
</div>

<script>
// Servie par le pont lui-meme, la page se connecte au meme hote et au meme
// port : rien a configurer. Les parametres d'URL ne servent que si la page
// est servie autrement (fichier local, autre serveur).
const params = new URLSearchParams(location.search);
const HOST = params.get("host") || location.hostname || "localhost";
const PORT = params.get("port") || location.port || "8765";

const el = (id) => document.getElementById(id);
const status = el("status");
let rateHz = null;
let channelCount = 0;     // canaux effectivement recus
let totalChannels = 0;    // canaux disponibles, annonces a l'accueil
let mode = "";

// Etat accumule : le pont n'envoie que les champs qui ont change (mode
// differentiel annonce dans le message d'accueil), plus un etat complet
// periodique marque "full".
let state = {};
let dirty = false;
let statusText = "Connexion...";
let receiving = null;      // le jeu envoie-t-il encore des paquets ?
let lastStatus = null;     // date de la derniere trame d'etat recue
let connected = false;     // liaison WebSocket etablie ?
let bridgeAlive = true;    // des trames d'etat arrivent-elles encore ?
let statusInterval = 1;    // periode annoncee par le serveur, en secondes

function pct(value, max) {
  if (!max) return 0;
  return Math.max(0, Math.min(100, (value / max) * 100));
}

function connect() {
  const ws = new WebSocket(`ws://${HOST}:${PORT}`);

  ws.onopen = () => {
    connected = true;
    bridgeAlive = true;
    statusText = `Connecte a ws://${HOST}:${PORT} — attente de l'accueil`;
    dirty = true;
  };

  // Reception : uniquement decoder et fusionner. Aucune ecriture dans le DOM
  // ici — sinon a 60 Hz les mises a jour entrent en concurrence avec le rendu
  // du navigateur. L'affichage est fait dans requestAnimationFrame, cale sur
  // l'ecran.
  ws.onmessage = (event) => {
    let d;
    try {
      d = JSON.parse(event.data);
    } catch (err) {
      return; // trame illisible : on l'ignore plutot que de casser onmessage
    }

    // Message d'accueil : schema des canaux, unites et cadence.
    if (d.type === "hello") {
      rateHz = d.rate_hz;
      if (d.status_interval) statusInterval = d.status_interval;
      totalChannels = (d.channels || []).length;
      channelCount = totalChannels;
      mode = d.differential ? "differentiel" : "complet";
      if (d.car_name) state.car_name = d.car_name;
      // Cet overlay n'affiche que six valeurs : inutile d'en recevoir 88.
      if (d.subscribe_supported) {
        ws.send(JSON.stringify({ subscribe: [
          "speed", "gear", "current_engine_rpm", "engine_max_rpm", "accel", "brake"
        ]}));
      }
      dirty = true;
      return;
    }

    if (d.type === "subscribed") {
      channelCount = d.channels ? d.channels.length : totalChannels;
      dirty = true;
      return;
    }

    // Trame d'etat periodique : sert aussi de battement de coeur. Son absence
    // prolongee signifie que le pont lui-meme s'est arrete.
    if (d.type === "status") {
      lastStatus = performance.now();
      bridgeAlive = true;
      receiving = d.receiving;
      if (d.car_name && d.car_name !== "-") state.car_name = d.car_name;
      dirty = true;
      return;
    }

    if (d.full) {
      state = d;          // etat complet : remplace la base
    } else {
      Object.assign(state, d);  // trame partielle : fusion
    }
    dirty = true;
  };

  ws.onclose = () => {
    connected = false;
    statusText = "Deconnecte — nouvelle tentative dans 2 s";
    dirty = true;
    setTimeout(connect, 2000);
  };

  ws.onerror = () => ws.close();
}

function paint() {
  const d = state;
  if (d.car_name) el("car").textContent = d.car_name;
  if (d.speed !== undefined) el("speed").textContent = Math.round(d.speed * 3.6);
  if (d.gear !== undefined) el("gear").textContent = d.gear === 0 ? "R" : d.gear;
  if (d.current_engine_rpm !== undefined) {
    el("rpm").style.width = pct(d.current_engine_rpm, d.engine_max_rpm || 8000) + "%";
  }
  // accel/brake sont des octets 0-255 dans la telemetrie Forza
  if (d.accel !== undefined) el("accel").style.width = pct(d.accel, 255) + "%";
  if (d.brake !== undefined) el("brake").style.width = pct(d.brake, 255) + "%";

  // Du plus grave au plus benin : liaison coupee, puis pont muet, puis jeu
  // arrete, puis fonctionnement normal. Tester le flux avant la liaison
  // rendait "Deconnecte" et "Pont injoignable" inatteignables.
  status.classList.remove("stale", "err");
  if (!connected) {
    status.textContent = statusText;
    status.classList.add("err");
  } else if (!bridgeAlive) {
    status.textContent = "Pont injoignable — aucune trame d'etat";
    status.classList.add("err");
  } else if (receiving === false) {
    status.textContent = "Jeu a l'arret — aucun paquet recu";
    status.classList.add("stale");
  } else if (rateHz !== null) {
    status.textContent =
      `Connecte — ${channelCount}/${totalChannels} canaux a ${rateHz} Hz (${mode})`;
  } else {
    status.textContent = statusText;
  }
}

function frame() {
  // Absence prolongee de trame d'etat = le pont ne repond plus, ce qu'un
  // flux simplement silencieux ne permettrait pas de distinguer.
  const limite = Math.max(3000, statusInterval * 3000);
  if (bridgeAlive && lastStatus !== null && performance.now() - lastStatus > limite) {
    bridgeAlive = false;
    dirty = true;
  }
  if (dirty) {
    dirty = false;
    paint();
  }
  requestAnimationFrame(frame);
}

// Un onglet masque ne declenche plus requestAnimationFrame (comportement
// normal : rien a afficher). Au retour, on force un rendu pour ne pas rester
// sur une image perimee si le flux est a l'arret a cet instant.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") dirty = true;
});

requestAnimationFrame(frame);
connect();
</script>
</body>
</html>
